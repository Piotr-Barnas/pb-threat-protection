# Declarative Automation Bundle configuration, more info here: https://docs.databricks.com/en/dev-tools/bundles/settings.html
bundle:
  name: "pb_threat_protection_daily_job"

include:
  - resources/*.yml
  - resources/*/*.yml

# Workspace-agnostic variables. Each deployer can override these at deploy time,
# e.g. databricks bundle deploy --target dev --var=catalog=main
variables:
  catalog:
    description: "Unity Catalog where threat protection tables and volumes live"
    default: "workspace"
  schema:
    description: "Schema for threat protection tables and volumes"
    default: "pb_threat_intelligence"
  run_as_principal:
    description: "User that prod jobs run as (defaults to the deploying user)"
    default: ${workspace.current_user.userName}

targets:
  # The 'dev' target, for development purposes.
  # No hardcoded host: the deployer's CLI auth (or DABRICKS_HOST) selects the workspace,
  # and the default root path (/Users/<deployer>/.bundle/...) keeps each person's copy separate.
  dev:
    mode: development

  # The 'prod' target, used for production deployment.
  prod:
    mode: production
    default: true
    # Jobs run as the deploying user. This variable accepts a user name.
    # For a service principal, use service_principal_name instead of user_name.
    # see https://docs.databricks.com/dev-tools/bundles/permissions.html.
    run_as:
      user_name: ${var.run_as_principal}
